    .cart-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #1e1e1e; padding: 15px 20px; border-top: 2px solid var(--accent); display: flex; justify-content: space-between; align-items: center; box-shadow: 0 -5px 15px rgba(0,0,0,0.5); }

    function renderMenu() {
      const container = document.getElementById('menuContainer');
      container.innerHTML = '';
      if(currentLang === 'ar') { document.body.style.direction = 'rtl'; } else { document.body.style.direction = 'ltr'; }

      menuData.forEach(cat => {
        const title = document.createElement('h3');
        title.className = 'category-title';
        title.innerText = cat.category[currentLang] || cat.category['en'];
        container.appendChild(title);

        cat.items.forEach(item => {
          const card = document.createElement('div');
          card.className = 'item-card';
          card.innerHTML = `
            <div class="item-info">
              <div class="item-title">${item.name}</div>
              <div class="item-price">Rp ${item.price.toLocaleString('id-ID')}</div>
            </div>
            <button class="btn-add" onclick="addToCart(${item.id}, '${item.name}', ${item.price})">+ Add</button>
          `;
          container.appendChild(card);
        });
      });
    }

    function addToCart(id, name, price) {
      const existing = cart.find(x => x.id === id);
      if(existing) existing.quantity++;
      else cart.push({ id, name, price, quantity: 1 });
      updateCartUI();
    }

    function updateCartUI() {
      const cartBar = document.getElementById('cartBar');
      if(cart.length === 0) { cartBar.style.display = 'none'; return; }
      cartBar.style.display = 'flex';
      const count = cart.reduce((acc, item) => acc + item.quantity, 0);
      const total = cart.reduce((acc, item) => acc + (item.price * item.quantity), 0);
      document.getElementById('cartCount').innerText = count;
      document.getElementById('cartTotal').innerText = `Rp ${total.toLocaleString('id-ID')}`;
    }

    async function submitOrder() {
      let total = 0;
      let orderListText = '';

      cart.forEach((item, index) => {
        const itemTotal = item.price * item.quantity;
        total += itemTotal;
        orderListText += `${index + 1}. *${item.name}* x${item.quantity} — Rp ${itemTotal.toLocaleString('id-ID')}\n`;
      });

      const message = 
`🔔 *НОВЫЙ ЗАКАЗ — СТОЛ №${tableNum}*
-----------------------------------
${orderListText}-----------------------------------
💰 *Итого:* Rp ${total.toLocaleString('id-ID')}
🌐 *Язык гостя:* ${currentLang.toUpperCase()}
🕒 *Время:* ${new Date().toLocaleTimeString('id-ID', { timeZone: 'Asia/Makassar' })} WITA`;

      try {
        const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: CHAT_ID,
            text: message,
            parse_mode: 'Markdown'
          })
        });

        if(res.ok) {
          alert('✅ Order sent to staff!');
          cart = [];
          updateCartUI();
        } else {
          alert('❌ Error sending order. Please inform staff.');
        }
      } catch (e) {
        alert('❌ Connection error.');
      }
    }

    function changeLanguage(lang) { currentLang = lang; renderMenu(); }

    const userLang = navigator.language || navigator.userLanguage;
    if(userLang.includes('ru')) currentLang = 'ru';
    else if(userLang.includes('id')) currentLang = 'id';
    else if(userLang.includes('it')) currentLang = 'it';
    else if(userLang.includes('ar')) currentLang = 'ar';
    document.getElementById('langSelect').value = currentLang;

    renderMenu();
